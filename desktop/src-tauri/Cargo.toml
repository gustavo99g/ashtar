[package]
name = "ashtar"
# A versão do app vem do desktop/package.json (tauri.conf.json, "version"). Esta não é usada.
version = "0.0.0"
description = "Ashtar"
authors = ["gustavo99g"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
wasapi = "0.24.0"
fast_image_resize = "6.1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.23.1"
livekit = "0.9.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Storage_Xps",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security_Credentials"
] }
sha2 = "0.11.1"
getrandom = "0.4.3"
# O WebView2 do Tauri: o mesmo `webview2-com` e `windows` que o `wry` já usa (conferir no Cargo.lock).
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
] }
tauri-plugin-updater = "2.13"
tokio = { version = "1", features = ["time"] }
tauri-plugin-window-state = "2.5.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
tauri-plugin-deep-link = "2.6.2"
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }


[dev-dependencies]
# Só para o teste de ponta a ponta (`media/share_e2e.rs`): o token do LiveKit local e o assinante.
livekit-api = { version = "0.10.0", default-features = false, features = ["access-token"] }
futures-util = "0.3"
[profile.dev.package.image]

opt-level = 3
