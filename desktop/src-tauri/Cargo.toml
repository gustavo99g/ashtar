[package]
name = "ashtar"
# A versão do app vem do desktop/package.json (tauri.conf.json, "version"). Esta não é usada.
version = "0.0.0"
description = "Ashtar"
authors = ["gustavo99g"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
wasapi = "0.24.0"
fast_image_resize = "6.1.0"    # sem uso desde a saida do legacy; fica para testar reduzir em BGRA antes do I420 (ADR 0009)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.23.1"
livekit = "0.9.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Storage_Xps",
    "Win32_System_Threading"
] }
tauri-plugin-updater = "2.13"
tokio = { version = "1", features = ["time"] }

[profile.dev.package.image]

opt-level = 3
