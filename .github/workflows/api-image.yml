name: Imagem da API

# Manual: Actions > Imagem da API > Run workflow. Roda as checagens da API, gera a imagem
# (api/Dockerfile) e publica no GHCR. A VPS não é tocada: para trocar a API lá,
#   docker compose pull api && docker compose up -d api
# (deploy/server/README.md).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/gustavo99g/ashtar-api

jobs:
  checks:
    name: Checagens
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api -> target

      - name: Formatação
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Testes
        run: cargo test

  image:
    name: Imagem
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` é o que a VPS baixa; o sha permite voltar para uma versão (API_TAG no .env da VPS).
      - name: Gerar e publicar
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo
        run: |
          echo "Publicada: \`${IMAGE}:latest\` e \`${IMAGE}:sha-${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Na VPS: \`docker compose pull api && docker compose up -d api\`" >> "$GITHUB_STEP_SUMMARY"
