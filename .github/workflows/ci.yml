name: CI

on:
  push:
    paths:
      - "api/**"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api -> target

      - name: Formatação
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Testes
        run: cargo test

      # O `cargo test` acima regrava os tipos do TypeScript do app (ts-rs). Se o arquivo mudou, uma
      # struct da API mudou sem o `cargo test` local e o commit do resultado.
      - name: Tipos do app em dia
        run: |
          if [ -n "$(git status --porcelain -- ../desktop/src/lib/api/generated)" ]; then
            echo "::error::Os tipos em desktop/src/lib/api/generated estão desatualizados. Rode cargo test em api/ e faça commit do resultado."
            git status --short -- ../desktop/src/lib/api/generated
            git diff -- ../desktop/src/lib/api/generated
            exit 1
          fi

  desktop:
    name: Desktop
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/desktop-checks
