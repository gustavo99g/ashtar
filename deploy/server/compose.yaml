# Servidor do Ashtar na VPS: LiveKit, Caddy (HTTPS) e a API.
# Todos usam a rede do host: o LiveKit anuncia o IP público para a mídia, e o
# Caddy fala com o LiveKit (7880) e com a API (3000) pelo 127.0.0.1.
#
# Antes de subir: ./setup.sh (gera .env, livekit.yaml, Caddyfile e api.env, que ficam só na VPS).

name: ashtar

services:
  livekit:
    image: livekit/livekit-server:v1.13.10
    command: --config /etc/livekit.yaml
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  caddy:
    image: caddy:2.11.7-alpine
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Só sobe com COMPOSE_PROFILES=api no .env, que o setup.sh liga quando a API roda aqui.
  # Atualizar: docker compose pull api && docker compose up -d api
  api:
    image: ghcr.io/gustavo99g/ashtar-api:${API_TAG:-latest}
    profiles: [api]
    network_mode: host
    restart: unless-stopped
    env_file: api.env
    volumes:
      - ./data:/data

volumes:
  caddy_data:
  caddy_config:
