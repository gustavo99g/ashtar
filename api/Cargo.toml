[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
dotenvy = "0.15.7"
livekit-api = "0.7.1"
tower-http = { version = "0.7.1", features = ["cors"] }
semver = "1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
uuid = { version = "1.28.0", features = ["v4"] }
sha2 = "0.11.1"
hex = "0.4.3"
getrandom = "0.4.3"
thiserror = "2.0.21"
