<script>
(() => {
  var abrir = document.getElementById("abrir");
  if (!abrir) return;

  // Tenta abrir o app logo que a página termina de carregar. Sem o Ashtar
  // instalado, o navegador não faz nada, e a pessoa segue pelo botão de baixar.
  window.addEventListener("load", () => {
    window.location.href = abrir.href;
  });

  // Quem baixa agora cola o link no app depois: ele já fica copiado.
  var link = abrir.getAttribute("data-link");
  document.getElementById("baixar").addEventListener("click", () => {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(link).catch(() => {
        copiarSemApi(link);
      });
    } else {
      copiarSemApi(link);
    }
  });

  // Navegador sem a API da área de transferência, ou página sem https.
  function copiarSemApi(texto) {
    var campo = document.createElement("textarea");
    campo.value = texto;
    campo.setAttribute("readonly", "");
    campo.style.position = "fixed";
    campo.style.opacity = "0";
    document.body.appendChild(campo);
    campo.select();
    try {
      document.execCommand("copy");
    } catch (erro) {
      // Sem como copiar: o link continua na barra de endereço.
    }
    document.body.removeChild(campo);
  }
})();
</script>
